name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::The KEYSTORE_B64 secret is missing. Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore

      - name: Get Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
          unzip -q gradle-8.14.3-bin.zip -d "$HOME/gradle"

      - name: Build the app
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          "$HOME/gradle/gradle-8.14.3/bin/gradle" assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done || true

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk NotionPhoneSync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NotionPhoneSync
          path: NotionPhoneSync.apk

      - name: Get the previous release (to test updating over it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          TAG=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || true)
          if [ -n "$TAG" ]; then gh release download "$TAG" -p NotionPhoneSync.apk -D prev -R ${{ github.repository }} || true; fi
          ls -la prev

      - name: Enable the virtual phone
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on a virtual phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke.sh

      - name: Share the test screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ls shots/*.png > /dev/null 2>&1; then
            gh release create "shots-${{ github.run_number }}" shots/*.png \
              --prerelease --latest=false \
              --title "Test screenshots (build ${{ github.run_number }})" \
              --notes "Screenshots from the automatic test on a virtual phone."
          fi

      - name: Publish a download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" NotionPhoneSync.apk \
            --latest \
            --title "Notion Phone Sync (build ${{ github.run_number }})" \
            --notes "Install from the app's Update button, or download NotionPhoneSync.apk below."
